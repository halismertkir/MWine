    <text x="46" y="87" font-size="17" fill="#a9b9b8" font-weight="400">Hadron v0.1.1 içindeki bileşenler • her yol ayrı uyumluluk testi gerektirir</text>
    <rect x="46" y="125" width="286" height="80" rx="12" fill="#192326" stroke="#354449"/>
