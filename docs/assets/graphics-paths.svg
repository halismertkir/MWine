    <rect x="387" y="569" width="4" height="48" rx="2" fill="#90cfea"/>
    <text x="407" y="587" font-size="20" fill="#edf2ef" font-weight="650">Zink (Vulkan)</text>
    <text x="407" y="615" font-size="15" fill="#a9b9b8" font-weight="400">Uyumluluk motorundaki bileşen</text>
    <rect x="772" y="553" width="382" height="80" rx="12" fill="#192326" stroke="#354449"/>
    <rect x="772" y="569" width="4" height="48" rx="2" fill="#bbeb5c"/>
    <text x="792" y="587" font-size="20" fill="#edf2ef" font-weight="650">KosmicKrisp → Metal</text>
    <text x="792" y="615" font-size="15" fill="#a9b9b8" font-weight="400">Apple Silicon GPU</text>
    <path d="M332 593H385" fill="none" stroke="#bbeb5c" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M715 593H770" fill="none" stroke="#bbeb5c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="46" y="698" font-size="16" fill="#a9b9b8" font-weight="400">Doğrudan Metal yolu, otomatik olarak daha yüksek FPS veya tam uyumluluk anlamına gelmez.</text>
    <text x="46" y="731" font-size="16" fill="#bbeb5c" font-weight="400">Bu çizim mimariyi anlatır; oyun benchmark sonucu değildir.</text>
