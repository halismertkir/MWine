<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
  <title id="title">DirectX, Vulkan ve OpenGL grafik çevirisi</title>
  <desc id="desc">DirectX 9 mtld3d, DirectX 10/11 DXMT üzerinden Metal kullanır. DirectX 12 vkd3d-proton, Vulkan winevulkan, OpenGL Zink üzerinden KosmicKrisp ve Metal kullanır.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10Z" fill="#bbeb5c"/>
    </marker>
  </defs>
  <rect width="1200" height="770" rx="24" fill="#101719"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
