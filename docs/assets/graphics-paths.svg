    <text x="66" y="508" font-size="15" fill="#a9b9b8" font-weight="400">Windows oyununun grafik çağrıları</text>
    <rect x="387" y="446" width="328" height="80" rx="12" fill="#192326" stroke="#354449"/>
    <rect x="387" y="462" width="4" height="48" rx="2" fill="#90cfea"/>
    <text x="407" y="480" font-size="20" fill="#edf2ef" font-weight="650">winevulkan</text>
